spring:
  application:
    name: dashboard

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dashboard}
    username: ${DB_USERNAME:dashboard}
    password: ${DB_PASSWORD:dashboard_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@dashboard.local}
