services:
  db:
    image: postgres:16
    container_name: dashboard-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dashboard -d dashboard
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
